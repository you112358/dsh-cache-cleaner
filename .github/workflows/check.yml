name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check the client bundle
        run: node --check client/client.js
      - name: Load the Host half
        run: node -e "import('./lib/index.js').then((m) => console.log('host ok:', m.name, m.inject.join(',')))"
      - name: Structural check of the client bundle
        run: node scripts/check-client.mjs
      - name: Behavioural check of the settings page
        run: node scripts/check-client-behavior.mjs
